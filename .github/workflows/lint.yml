name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main, develop]

jobs:
  static-analysis:
    name: Format, lint, type-check, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run Oxlint
        run: pnpm lint

      - name: Run TypeScript 7 type check
        run: pnpm type-check

      - name: Run TypeScript 6 compatibility check
        run: pnpm type-check:compat

      - name: Run TypeScript 7 test type check
        run: pnpm type-check:test

      - name: Run TypeScript 6 test compatibility check
        run: pnpm type-check:test:compat

      - name: Build
        run: pnpm build:prod

  integration:
    name: Unit, migration, seed, and end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nest_boilerplate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nest_boilerplate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_ISSUER: awesome-nest-boilerplate-test
      JWT_AUDIENCE: awesome-nest-api-test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: nest_boilerplate_test
      DB_SSL: false
      DB_DROP_SCHEMA: false
      ENABLE_ORM_LOGS: false
      AWS_S3_BUCKET_REGION: us-east-1
      AWS_S3_API_VERSION: 2006-03-01
      AWS_S3_BUCKET_NAME: test-bucket
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate test JWT keys
        shell: bash
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt-private.pem
          openssl pkey -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
          {
            echo 'JWT_PRIVATE_KEY<<JWT_PRIVATE_KEY_EOF'
            cat /tmp/jwt-private.pem
            echo 'JWT_PRIVATE_KEY_EOF'
            echo 'JWT_PUBLIC_KEY<<JWT_PUBLIC_KEY_EOF'
            cat /tmp/jwt-public.pem
            echo 'JWT_PUBLIC_KEY_EOF'
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: pnpm test

      - name: Run database migrations
        run: pnpm migration:run

      - name: Run database seeds
        run: pnpm seed:run

      - name: Run end-to-end and transaction rollback tests
        run: pnpm test:e2e
